server:
  port: 8082
spring:
  application:
    name: department-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/department_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
app:
  admin-username: ${APP_ADMIN_USERNAME:admin}
  admin-password: ${APP_ADMIN_PASSWORD}
  user-username: ${APP_USER_USERNAME:user}
  user-password: ${APP_USER_PASSWORD}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: "${JWT_SECRET:ZKZWIUvEblIrWfq2GM/glTO5u5n4WukC1gUxSYPVhMU=}"
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
employee:
  service-url: ${EMPLOYEE_SERVICE_URL:http://localhost:8081}
department:
  service-url: ${DEPARTMENT_SERVICE_URL:http://localhost:8082}
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
